<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="gap" x1="0" y1="0" x2="0.65" y2="1">
<stop offset="0%" stop-color="#a6b0ba"/><stop offset="55%" stop-color="#414a54"/><stop offset="100%" stop-color="#131a20"/></linearGradient>
<radialGradient id="glap" cx="32%" cy="6%" r="80%">
<stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>

</defs>
<rect x="0" y="0" width="1024" height="1024" fill="url(#gap)"/>
<g id="art" transform="translate(-51.82,-87.84) scale(2.1685)">


<!-- desk -->
<g>
  <!-- back legs -->
  <rect x="140" y="268" width="20" height="140" rx="6" fill="#6d3315"/>
  <rect x="372" y="268" width="20" height="140" rx="6" fill="#6d3315"/>
  <!-- top surface (3/4) -->
  <path d="M118 224 L394 224 L438 300 L82 300 Z" fill="#c98a56"/>
  <path d="M118 224 L394 224 L402 238 L110 238 Z" fill="#d9a071" opacity=".5"/>
  <!-- front edge -->
  <path d="M82 300 L438 300 L438 326 L82 326 Z" fill="#b06a3a"/>
  <path d="M82 300 L438 300 L438 308 L82 308 Z" fill="#c98a56" opacity=".6"/>
  <!-- apron / drawer -->
  <rect x="104" y="326" width="312" height="52" fill="#8f4520"/>
  <rect x="130" y="338" width="120" height="30" rx="7" fill="#6d3315" opacity=".7"/>
  <rect x="268" y="338" width="120" height="30" rx="7" fill="#6d3315" opacity=".7"/>
  <rect x="172" y="350" width="36" height="7" rx="3.5" fill="#dda12e"/>
  <rect x="310" y="350" width="36" height="7" rx="3.5" fill="#dda12e"/>
  <!-- front legs -->
  <rect x="104" y="378" width="24" height="52" rx="7" fill="#8f4520"/>
  <rect x="392" y="378" width="24" height="52" rx="7" fill="#8f4520"/>
  <rect x="104" y="378" width="8" height="52" rx="4" fill="#b06a3a" opacity=".7"/>
  <rect x="392" y="378" width="8" height="52" rx="4" fill="#b06a3a" opacity=".7"/>
</g>

<!-- the request lying on the desk, stamped -->
<g>
  <path d="M150 238 L294 238 L316 292 L168 292 Z" fill="#cfc7b6"
        stroke="#cfc7b6" stroke-width="10" stroke-linejoin="round" transform="translate(4,5)"/>
  <path d="M150 238 L294 238 L316 292 L168 292 Z" fill="#faf6ee"
        stroke="#faf6ee" stroke-width="10" stroke-linejoin="round"/>
  <g stroke="#2a2622" stroke-width="6" stroke-linecap="round" opacity=".15">
    <path d="M166 250 L262 250 M170 262 L286 262"/>
  </g>
  <g transform="translate(238,274)">
    <ellipse cx="0" cy="0" rx="40" ry="17" fill="none" stroke="#3f8f52" stroke-width="8"/>
    <path d="M-17 0 L-5 7 L17 -8" stroke="#3f8f52" stroke-width="9" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- the stamp, standing on the desk -->
<g transform="translate(360,186) scale(0.86)">
  <ellipse cx="2" cy="104" rx="66" ry="12" fill="#2a1810" opacity=".22"/>
  <ellipse cx="0" cy="-58" rx="34" ry="15" fill="#d09263"/>
  <rect x="-34" y="-58" width="68" height="64" rx="14" fill="#b06a3a"/>
  <rect x="-27" y="-52" width="15" height="48" rx="7.5" fill="#fff" opacity=".2"/>
  <rect x="-40" y="0" width="80" height="18" rx="9" fill="#8f4520"/>
  <path d="M-46 68 L-32 20 L32 20 L46 68 Z" fill="#8f4520"/>
  <path d="M-46 68 L-32 20 L32 20 L46 68 Z" fill="#b06a3a" transform="translate(0,-4)"/>
  <path d="M-36 60 L-24 22 L-14 22 L-27 60 Z" fill="#fff" opacity=".17"/>
  <rect x="-64" y="64" width="128" height="34" rx="13" fill="#2f2a26"/>
  <rect x="-64" y="64" width="128" height="12" rx="6" fill="#4a423b"/>
  <rect x="-56" y="90" width="112" height="10" rx="5" fill="#2c6b3c"/>
</g>

</g>
<rect x="0" y="0" width="1024" height="1024" fill="url(#glap)"/>

</svg>